/* =========================================================
   WEBSOCKET → OBS (Advanced Scene Switcher)

   Режим: подключиться → отправить сигнал → сразу отключиться.
   Так на мобильных стабильно, и в списке клиентов OBS
   не копятся удалённые адреса.
   ========================================================= */

const WS_URL_KEY = "nri_ws_url_v1";
const WS_PASSWORD_KEY = "nri_ws_password_v1";

let sendingLock = false;


function loadWsUrl() {
    try {
        const saved = localStorage.getItem(WS_URL_KEY);
        if (saved) {
            document.getElementById("wsUrl").value = saved;
        } else {
            document.getElementById("wsUrl").value =
                "ws://yippee-scouring-clear.ngrok-free.dev";
        }
    } catch (e) {
        document.getElementById("wsUrl").value =
            "ws://yippee-scouring-clear.ngrok-free.dev";
    }

    try {
        const savedPassword = localStorage.getItem(WS_PASSWORD_KEY);
        if (savedPassword !== null) {
            document.getElementById("wsPassword").value = savedPassword;
        }
    } catch (e) {}
}


function saveWsUrl() {
    try {
        const url = document.getElementById("wsUrl").value.trim();
        localStorage.setItem(WS_URL_KEY, url);
    } catch (e) {}
}


function saveWsPassword() {
    try {
        const password = document.getElementById("wsPassword").value;
        localStorage.setItem(WS_PASSWORD_KEY, password);
    } catch (e) {}
}


function openOnlinePanel() {
    document
        .getElementById("onlineOverlay")
        .classList
        .add("visible");
}


function closeOnlinePanel() {
    document
        .getElementById("onlineOverlay")
        .classList
        .remove("visible");
}


function setWsStatus(text, type = "") {
    const el = document.getElementById("wsStatus");
    el.textContent = text;
    el.className = "online-status" + (type ? " " + type : "");
}


/**
 * Одноразовая сессия при каждом броске:
 * connect → CallVendorRequest → disconnect
 * Так стабильнее на мобильных, в OBS не копятся клиенты.
 */
async function sendObsMessage(message) {
    if (sendingLock) return false;

    const url = document.getElementById("wsUrl").value.trim();
    const password = document.getElementById("wsPassword").value;

    if (!url) {
        setWsStatus("Укажи адрес WebSocket в Онлайн", "err");
        return false;
    }

    sendingLock = true;
    let socket = null;
    let stage = "создание подключения";

    const withTimeout = (promise, ms, label) =>
        Promise.race([
            promise,
            new Promise((_, reject) =>
                setTimeout(
                    () => reject(new Error("Тайм-аут: " + label)),
                    ms
                )
            )
        ]);

    try {
        setWsStatus("Подключаюсь к OBS…");
        socket = new OBSWebSocket();

        stage = "подключение к OBS";
        await withTimeout(
            socket.connect(url, password || undefined),
            10000,
            stage
        );

        setWsStatus("Подключено. Отправляю " + message + "…");

        stage = "вызов Advanced Scene Switcher";
        await withTimeout(
            socket.call("CallVendorRequest", {
                vendorName: "AdvancedSceneSwitcher",
                requestType: "AdvancedSceneSwitcherMessage",
                requestData: { message: message }
            }),
            10000,
            stage
        );

        setWsStatus(message + " отправлен ✓", "ok");
        return true;

    } catch (err) {
        console.error("Ошибка отправки в OBS:", stage, err);
        setWsStatus("Ошибка (" + stage + "): " +
            (err.message || err), "err");
        return false;

    } finally {
        if (socket) {
            try {
                await Promise.race([
                    socket.disconnect(),
                    new Promise(resolve => setTimeout(resolve, 1500))
                ]);
            } catch (e) {}
        }

        sendingLock = false;
    }
}


function sendRollSignal(outcome) {
    let signal = null;

    if (outcome === "УСПЕХ") {
        signal = "USP";
    } else if (outcome === "КАТАСТРОФА") {
        signal = "KAT";
    }

    if (signal) {
        sendObsMessage(signal);
    }
}


/* =========================================================
   ЛОГ СОБЫТИЙ (броски, ресурс, трюки) — до 20, в localStorage
   ========================================================= */

const LOG_STORAGE_KEY = "nri_event_log_v1";
const ROLL_LOG_MAX = 20;

let rollLogEntries = loadEventLog();
let logsVisible = false;


function loadEventLog() {
    try {
        const raw =
            localStorage.getItem(
                LOG_STORAGE_KEY
            );

        if (!raw) {
            return [];
        }

        const parsed =
            JSON.parse(raw);

        if (!Array.isArray(parsed)) {
            return [];
        }

        return parsed
            .filter(
                item =>
                    typeof item === "string"
            )
            .slice(0, ROLL_LOG_MAX);

    } catch (e) {
        return [];
    }
}


function saveEventLog() {
    try {
        localStorage.setItem(
            LOG_STORAGE_KEY,
            JSON.stringify(
                rollLogEntries
            )
        );
    } catch (e) {}
}


function formatLogTime() {
    const now = new Date();

    const h =
        String(now.getHours()).padStart(2, "0");

    const m =
        String(now.getMinutes()).padStart(2, "0");

    return h + ":" + m;
}


function addRollLog(text) {
    if (!text) {
        return;
    }

    const line =
        formatLogTime() + "  " + text;

    rollLogEntries.unshift(line);

    if (rollLogEntries.length > ROLL_LOG_MAX) {
        rollLogEntries.length = ROLL_LOG_MAX;
    }

    saveEventLog();

    if (logsVisible) {
        renderRollLog();
    }
}


function renderRollLog() {
    const el = document.getElementById("rollLog");

    if (!el) {
        return;
    }

    el.innerHTML = "";

    rollLogEntries.forEach(entry => {
        const row = document.createElement("div");
        row.className = "roll-log-entry";
        row.textContent = entry;
        el.appendChild(row);
    });
}


function toggleLogs() {
    logsVisible = !logsVisible;

    const section =
        document.getElementById(
            "rollLogSection"
        );

    const btn =
        document.getElementById(
            "logsBtn"
        );

    if (section) {
        section.classList.toggle(
            "visible",
            logsVisible
        );
    }

    if (btn) {
        btn.classList.toggle(
            "edit-btn",
            logsVisible
        );

        if (logsVisible) {
            btn.classList.add("active");
        } else {
            btn.classList.remove("active");
        }
    }

    if (logsVisible) {
        renderRollLog();
    }
}


/* =========================================================
   ГАЛЕРЕЯ (1.jpg … 3.jpg)
   ========================================================= */

const GALLERY_BASE =
    "https://raw.githubusercontent.com/mikeoneseven/netgeroev/main/";

const GALLERY_FILES = [
    "1.jpg",
    "2.jpg",
    "3.jpg"
];

let galleryIndex = 0;


function galleryUrl(index) {
    return (
        GALLERY_BASE +
        GALLERY_FILES[index] +
        "?t=" +
        Date.now()
    );
}


function showGalleryImage(index) {
    const total = GALLERY_FILES.length;

    galleryIndex =
        ((index % total) + total) % total;

    const img = document.getElementById("galleryImg");
    const hint = document.getElementById("galleryHint");

    if (img) {
        img.src = galleryUrl(galleryIndex);
    }

    if (hint) {
        hint.textContent =
            (galleryIndex + 1) + " / " + total;
    }
}


function setupGallery() {
    const el = document.getElementById("gallery");

    if (!el) {
        return;
    }

    el.addEventListener("click", event => {
        const rect = el.getBoundingClientRect();
        const x = event.clientX - rect.left;

        if (x < rect.width / 2) {
            showGalleryImage(galleryIndex - 1);
        } else {
            showGalleryImage(galleryIndex + 1);
        }
    });

    showGalleryImage(0);
}

loadWsUrl();

document.getElementById("wsUrl").addEventListener("input", () => {
    saveWsUrl();
});

document.getElementById("wsPassword").addEventListener("input", () => {
    saveWsPassword();
});

setupGallery();

render();
